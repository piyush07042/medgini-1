<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MediGenie CDSS — Secure Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-8 space-y-6">
        <div class="text-center space-y-2">
            <i class="fa-solid fa-shield-heart text-cyan-400 text-5xl mb-2"></i>
            <h1 class="text-2xl font-bold tracking-tight">MediGenie Clinical Portal</h1>
            <p class="text-xs text-slate-400">Multi-Agent AI Decision Support Gateway</p>
        </div>
        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Clinical Identifier / Email</label>
                <input type="text" id="email" value="doctor@medigenie.hospital" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-cyan-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Secure Password</label>
                <input type="password" id="password" value="securepass123" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-cyan-500 focus:outline-none">
            </div>
            <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold py-3 rounded-xl transition text-sm shadow-lg flex items-center justify-center gap-2">
                <i class="fa-solid fa-right-to-bracket"></i> Authenticate Session
            </button>
            <div id="errorMsg" class="text-center text-xs text-emerald-400 font-medium"></div>
        </form>
    </div>
    <script>
        function handleLogin(e) {
            e.preventDefault();
            document.getElementById('errorMsg').textContent = "JWT Authorized. Redirecting to Enterprise Dashboard...";
            setTimeout(() => { window.location.href = '/dashboard'; }, 1000);
        }
    </script>
</body>
</html>
